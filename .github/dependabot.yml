version: 2

# Automated dependency surveillance. This repo carries three code ecosystems, a container base-image
# set, a compose-only runtime-image set, and GitHub Actions — a CVE in any of them is a finding an
# enterprise reviewer will ask about, so each is tracked separately rather than by periodic audit.
#
# Two things Dependabot does NOT do, and the repo compensates for elsewhere:
#   - it never touches a Go `toolchain` line or a `go-version:` value — the toolchain pin in go.mod
#     is a manual obligation, triggered by govulncheck reporting a stdlib CVE;
#   - a full `open-pull-requests-limit` does not queue, it ERRORS silently at /network/updates and
#     drops the update — so the limits below are generous and the bumps are grouped, because a
#     blackout looks exactly like "nothing to update".
updates:
  # Root Go module: commbot, p2p-orchestrator, inventory-intelligence, tools, internal/platform.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(go)"
    groups:
      # Patch bumps are routine and reviewing them one PR at a time is noise, not diligence.
      go-patch:
        update-types: [patch]

  # viz-gateway is a SEPARATE Go module and is invisible to the root manifest.
  - package-ecosystem: gomod
    directory: /services/viz-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(viz)"
    groups:
      viz-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(frontend)"
    groups:
      # Next.js and React must move together; splitting them produces PRs that cannot pass CI.
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      # Type packages and tooling patches: routine.
      frontend-patch:
        update-types: [patch]
        exclude-patterns: ["next", "react", "react-dom", "eslint-config-next"]
    ignore:
      # TypeScript 7 is the native (Go) port and its emit breaks `next build` under Next 16.x:
      #   "The \"id\" argument must be of type string. Received undefined"
      # The frontend image is built by every compose boot job, so a frontend build failure takes the
      # ENTIRE E2E matrix down. Revisit when Next declares TS 7 support.
      - dependency-name: typescript
        versions: [">=7"]
      # ESLint 10 removed the ESLint 9 context API that eslint-plugin-react (bundled by
      # eslint-config-next) still uses, so under ESLint 10 `next lint` aborts before linting a single
      # file. Lint is a GATE here, and a gate that cannot run is not a gate — the frontend stays on
      # the 9.x line until eslint-plugin-react ships an ESLint 10 build. Check its peerDependencies.
      # ACCEPTED RISK: npm reports 9.x as past its support window. ESLint is dev-time tooling with
      # no runtime exposure, so a working, gated 9.x beats an unrunnable 10.x; revisit the moment
      # `npm view eslint-plugin-react peerDependencies.eslint` includes ^10.
      - dependency-name: eslint
        versions: [">=10"]

  # Dockerfile base images, pinned by DIGEST (tag@sha256). There is NO Dockerfile at the repo root;
  # every build context is listed explicitly, otherwise the ecosystem fails outright with "No
  # Dockerfiles nor Kubernetes YAML found in /" and nothing is surveilled.
  #
  # Digest pinning is what makes `gcr.io/distroless/static:nonroot` trackable at all — it is a
  # floating, non-semver tag that Dependabot cannot version-bump, but it CAN bump a digest.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /services/commbot
      - /services/inventory-intelligence
      - /services/p2p-orchestrator
      - /services/viz-gateway
      - /tools/mock-llm
      - /tools/seed
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(docker)"
    groups:
      # Six images share the same golang builder and the same distroless runtime. Bumping them as
      # one PR is the only way to keep the images in lockstep and the CI toolchain equal to the
      # builder; six separate PRs was how the queue filled up.
      go-images:
        patterns: ["golang", "gcr.io/distroless/static"]

  # RUNTIME images — the cockroachdb/cockroach and apache/kafka pins appear ONLY in
  # docker-compose.yml, never in a Dockerfile. `docker` and `docker-compose` are distinct Dependabot
  # ecosystems and the former does not read compose files, so without this entry the database and
  # the broker — the most security-sensitive images in the stack — have zero surveillance.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(compose)"
    ignore:
      # CockroachDB alternates Regular releases (even minors: v26.2, v26.4 …) with optional
      # Innovation releases (odd minors: v26.1, v26.3 …). Innovation releases are skippable by
      # design, get a shorter support window, and are not what a production cluster tracks. The
      # stack follows the Regular line; each odd minor is ignored explicitly because Dependabot
      # has no "even minors only" rule. Extend this list when the next Regular release lands.
      - dependency-name: cockroachdb/cockroach
        versions: [">=26.3.0, <26.4.0", ">=26.5.0, <26.6.0", ">=27.1.0, <27.2.0", ">=27.3.0, <27.4.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
    groups:
      # Actions are pinned by SHA; Dependabot rewrites `sha # vX.Y.Z` pairs. One PR per week for
      # all of them is the right review unit.
      actions:
        patterns: ["*"]

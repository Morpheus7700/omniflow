version: 2

# Automated dependency surveillance. This repo carries three independent ecosystems and a container
# base-image set, and a CVE in any of them is a finding an enterprise reviewer will ask about — so
# each is tracked separately rather than relying on a periodic manual audit.
updates:
  # Root Go module: commbot, p2p-orchestrator, inventory-intelligence, tools.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(go)"
    groups:
      # Patch bumps are routine and reviewing them one PR at a time is noise, not diligence.
      go-patch:
        update-types: [patch]

  # viz-gateway is a SEPARATE Go module and is invisible to the root manifest.
  - package-ecosystem: gomod
    directory: /services/viz-gateway
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(viz)"
    groups:
      viz-patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      # Next.js and React must move together; splitting them produces PRs that cannot pass CI.
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
    ignore:
      # TypeScript 7 is the native (Go) port and its emit breaks `next build` under Next 16.2.x:
      #   "The \"id\" argument must be of type string. Received undefined"
      #   → Next.js build worker exited with code: 1
      # The frontend image is built by all four compose boot jobs, so a frontend build failure takes
      # the ENTIRE E2E matrix down — this is not a frontend-only risk. Revisit when Next declares
      # TS 7 support; until then re-opening this weekly is pure noise.
      - dependency-name: typescript
        versions: [">=7"]

  # Dockerfile BUILD stages. There is NO Dockerfile at the repo root — every one lives one or two
  # levels down, and `directory: /` made this ecosystem fail outright with "No Dockerfiles nor
  # Kubernetes YAML found in /", so nothing here was ever actually surveilled. Each build context
  # must be listed explicitly.
  #
  # Realistic coverage is the `golang:*` and `node:*` builder stages. The runtime stage of all five
  # Go images is `gcr.io/distroless/static:nonroot` — a floating, non-semver tag Dependabot cannot
  # version-bump. Tracking distroless properly would require digest pinning; until then, do not
  # claim it is covered.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /services/commbot
      - /services/inventory-intelligence
      - /services/p2p-orchestrator
      - /services/viz-gateway
      - /tools/mock-llm
      - /tools/seed
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"

  # RUNTIME images — the cockroachdb/cockroach and apache/kafka pins appear ONLY in
  # docker-compose.yml, never in a Dockerfile. `docker` and `docker-compose` are distinct Dependabot
  # ecosystems and the former does not read compose files, so these two pins — the database and the
  # broker, the most security-sensitive images in the stack — had zero surveillance while the config
  # appeared to cover them. Dependabot config errors surface at /network/updates, never as a CI
  # check, which is why that gap could sit unnoticed indefinitely.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(compose)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions)"

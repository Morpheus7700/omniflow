name: CodeQL

# GitHub's first-party SAST — free on public repos, results land in the Security tab.
# Analyzes the root Go module (commbot, p2p-orchestrator, inventory-intelligence — the
# security-critical services). viz-gateway is a separate module; add a second config block if
# its projection layer later warrants deep analysis.

on:
  push:
    branches: [ master, main ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, catches newly-disclosed CVE patterns in unchanged code

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - name: build (root module)
        run: CGO_ENABLED=0 go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

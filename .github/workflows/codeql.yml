name: CodeQL

# GitHub's first-party SAST — free on public repos, results land in the Security tab.
# Two matrix legs: Go (both modules — viz-gateway has its own go.mod and was previously unscanned)
# and the TypeScript frontend. Runs on every PR and weekly, so newly-disclosed patterns are caught
# in code that has not changed.

on:
  push:
    branches: [ master, main ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod   # the `toolchain` directive is the single Go pin — see e2e.yml
          cache-dependency-path: |
            go.sum
            services/viz-gateway/go.sum
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'go'
        name: build (both modules)
        run: |
          CGO_ENABLED=0 go build ./...
          ( cd services/viz-gateway && CGO_ENABLED=0 go build ./... )
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

name: Deploy to GCP Cloud Run

on:
  workflow_run:
    workflows: ["OmniFlow CI + E2E"]
    branches: [master]
    types:
      - completed

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      id-token: write # required for Workload Identity Federation

    env:
      REGISTRY: us-central1-docker.pkg.dev/my-project/my-repo
      REGION: us-central1
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Must map CockroachDB Serverless connection string

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
          service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # ── Build and Push Images ──
      
      - name: Build and Push commbot
        run: |
          docker build -t ${{ env.REGISTRY }}/commbot:${{ github.sha }} -f services/commbot/Dockerfile .
          docker push ${{ env.REGISTRY }}/commbot:${{ github.sha }}

      - name: Build and Push p2p-orchestrator
        run: |
          docker build -t ${{ env.REGISTRY }}/p2p-orchestrator:${{ github.sha }} -f services/p2p-orchestrator/Dockerfile .
          docker push ${{ env.REGISTRY }}/p2p-orchestrator:${{ github.sha }}

      - name: Build and Push inventory-intelligence
        run: |
          docker build -t ${{ env.REGISTRY }}/inventory-intelligence:${{ github.sha }} -f services/inventory-intelligence/Dockerfile .
          docker push ${{ env.REGISTRY }}/inventory-intelligence:${{ github.sha }}

      - name: Build and Push viz-gateway
        run: |
          docker build -t ${{ env.REGISTRY }}/viz-gateway:${{ github.sha }} -f services/viz-gateway/Dockerfile services/viz-gateway
          docker push ${{ env.REGISTRY }}/viz-gateway:${{ github.sha }}

      # ── Deploy to Cloud Run ──

      - name: Deploy commbot
        run: |
          gcloud run deploy commbot \
            --image ${{ env.REGISTRY }}/commbot:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="CRDB_DSN=${{ env.DATABASE_URL }}"

      - name: Deploy viz-gateway
        run: |
          gcloud run deploy viz-gateway \
            --image ${{ env.REGISTRY }}/viz-gateway:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars="CRDB_DSN=${{ env.DATABASE_URL }},DATABASE_URL=${{ env.DATABASE_URL }}"

      - name: Deploy p2p-orchestrator
        run: |
          gcloud run deploy p2p-orchestrator \
            --image ${{ env.REGISTRY }}/p2p-orchestrator:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --no-allow-unauthenticated \
            --set-env-vars="CRDB_DSN=${{ env.DATABASE_URL }}"

      - name: Deploy inventory-intelligence
        run: |
          gcloud run deploy inventory-intelligence \
            --image ${{ env.REGISTRY }}/inventory-intelligence:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --no-allow-unauthenticated \
            --set-env-vars="CRDB_DSN=${{ env.DATABASE_URL }}"

name: OmniFlow CI + E2E

# Make-It-Real gate: build both Go modules, then actually BOOT the stack and prove one seeded
# procurement event flows end-to-end — through the real CRDB→Kafka changefeed spine, the DAG
# orchestrator's human-in-the-loop suspend/resume, and out to the viz SSE stream. No simulated logs.
#
# Test tiers, fastest first: `build` runs unit tests (no services), `integration` runs the tag-gated
# testcontainers suite against a real CockroachDB, and the four boot jobs run the full stack.
#
# OPTIONAL repo secrets (Settings → Secrets and variables → Actions):
#   CRDB_LICENSE  — CockroachDB Enterprise (free tier) license key. NOT needed here: the stack runs
#                   single-node v24.3+, which does Kafka-sink changefeeds license-free. Only a
#                   multi-node cluster would require it.
#   CRDB_ORG      — the organization string the license was issued to (must match exactly).
# No job is skipped for a missing license; crdb-init fails loudly if a key ever becomes necessary.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref. Without this every push spawns a full parallel run while
# the previous one keeps burning runners — during the CI convergence work several obsolete runs were
# still executing (some pinned at the 25-minute job cap) after their fix had already been pushed,
# which wasted minutes and made the signal harder to read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go toolchain: pinned to an EXACT patch, deliberately, in every job.
#
# It used to read `go-version: '1.25'`, and that floating spec silently broke the security gate.
# `setup-go` is satisfied by any 1.25.x already in the runner image's tool cache, so it keeps
# handing back the cached patch instead of fetching the newest one. On 2026-08-14 the
# actions/go-versions manifest published 1.25.13 at 03:55Z; a run at 12:35Z the SAME DAY still
# resolved to 1.25.12 and govulncheck failed with seven reachable stdlib CVEs
# (GO-2026-6218/6091/6090/6089/6088/5972/5026), every one of them "Fixed in: go1.25.13". Re-running
# would not have fixed it. Only an explicit version does.
#
# The pin is 1.26.6 — NOT 1.25.13 — because all six Go builder stages use `FROM golang:1.26`, so a
# CI pinned to the 1.25 line was scanning a stdlib this project never ships. 1.26.6 and 1.25.13 were
# published in the same manifest update (the same coordinated security release), so it carries the
# same seven fixes and closes the CI-vs-artifact divergence at the same time. go.mod stays at
# `go 1.25.0`: that declares the minimum language version, not the build toolchain.
#
# The cost is a maintenance obligation, and it is intentional. Dependabot's github-actions ecosystem
# bumps action refs only — it will NEVER touch a go-version value — so a future toolchain CVE means
# this gate goes red until a human bumps these pins. That is the same trade already made for
# govulncheck@v1.6.0 and Trivy v0.72.0 below: a security gate that silently re-floats is not a gate.
# Bump all nine sites here and the one in codeql.yml together.

jobs:
  build:
    name: build + vet + unit tests (both modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      # Formatting is a gate, not a suggestion. It is checked before anything else because it is the
      # cheapest possible signal and because an unformatted tree is how "we have standards" quietly
      # becomes "we had standards". gofmt is semantics-preserving by construction, so this can never
      # fail for a reason that is really a behaviour change.
      - name: gofmt (both modules)
        run: |
          unformatted="$(gofmt -l ./services ./tools ./contracts)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ./services ./tools ./contracts"
            exit 1
          fi
      # Unit tests need no Docker and no services — they run on every push in seconds. The
      # testcontainers suite is excluded here by its `integration` build tag (see the job below).
      - name: root module
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test ./...
      - name: viz-gateway module
        working-directory: services/viz-gateway
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test ./...

      # The frontend had a `lint` script and nothing that ran it, so `next lint` was a button nobody
      # pressed: a react-hooks/set-state-in-effect error sat on master unnoticed because the only
      # frontend signal in CI was `next build` inside the four boot jobs, and a lint error does not
      # fail a build. That is the same shape as the report-only-scanner problem described on the
      # govulncheck job below — a check that cannot fail anything is a check nobody reads.
      #
      # Type-checking is separate from linting and neither implies the other: `next build` does run
      # tsc, but only in the boot jobs, which cost ~25 minutes and pull the whole Docker stack to
      # tell you about a type error. Here it costs seconds and runs on every push.
      #
      # Node 26 matches frontend/Dockerfile's builder stage, for the same reason the Go toolchain is
      # pinned to the version the Go images build with: CI should exercise the runtime that ships.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
      # `npm run lint` is NOT gated, and that is a finding rather than an omission. Under the
      # dependency set npm ci installs today — ESLint 10.8.1 (#49) with the eslint-plugin-react
      # that eslint-config-next 16.3.0 (#45) pulls in — eslint aborts before linting anything:
      #   TypeError: Error while loading rule 'react/display-name':
      #     contextOrFilename.getFilename is not a function
      # That is the plugin using an ESLint 9 context API that ESLint 10 removed, i.e. broken
      # upstream, not broken here. Gating on it would block every PR on a bug we cannot fix.
      #
      # It runs anyway so the output is visible, and `|| true` keeps it advisory — with the tripwire
      # below, because an advisory step that silently rots is the exact failure this repo already
      # documented for gosec and Trivy. When the plugin ships an ESLint 10 build, lint starts
      # SUCCEEDING, the tripwire fires, and whoever sees it deletes these lines and gates it.
      - name: frontend lint (advisory — blocked upstream, see comment)
        working-directory: frontend
        run: |
          if npm run lint; then
            echo "::warning::eslint now passes — the upstream incompatibility is fixed. Promote this step to a gate and delete the || true."
          else
            echo "::notice::eslint still failing; expected while eslint-plugin-react lags ESLint 10."
          fi
        continue-on-error: true

  # Reachability-based CVE scanning, and the ONLY security job here that actually gates.
  #
  # gosec runs `-no-fail` and Trivy runs `--exit-code 0`, both deliberately: they are broad,
  # manifest-and-pattern based, and noisy enough that gating on them would train everyone to ignore
  # a red build. That is a reasonable trade — but it left a real gap, because "report-only" meant
  # nobody was reading them. A scan on master found FIVE vulnerabilities our code genuinely reaches,
  # sitting in plain sight in the Trivy SARIF the whole time.
  #
  # govulncheck is different in kind: it walks the call graph and reports a vulnerability only if
  # your code actually reaches the affected symbol. That makes its output small and true enough to
  # block on, which is the entire point of adding it. If this job goes red, a reachable CVE landed —
  # fix the dependency, do not add an exclusion.
  #
  # Both modules are scanned. viz-gateway has its own go.mod and is invisible to a root-module scan;
  # it was carrying a vulnerable golang.org/x/text that the root scan reported as clean.
  govulncheck:
    name: govulncheck (reachable CVEs, gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      # Pinned to an immutable tag, not @latest — same standard the Trivy install below follows.
      # A security job that fetches an unpinned toolchain on every run undercuts its own purpose,
      # and @latest also makes the gate non-reproducible: a scanner bump could turn the build red
      # without a single line of our code changing. Bump this tag deliberately, like any other pin.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: root module
        run: govulncheck ./...
      - name: viz-gateway module
        working-directory: services/viz-gateway
        run: govulncheck ./...

  integration:
    name: integration tests (testcontainers + real CRDB)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15   # container pull + boot should be minutes; a stall must fail fast, not hang
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      # ubuntu-latest runners ship a running Docker daemon, which is all testcontainers needs.
      # These cover what fakes cannot: single-transaction atomicity, the exactly-once idempotency
      # guard, lot ordering, and DECIMAL/INT8 fidelity through real SQL.
      - name: root module
        run: go test -tags=integration -timeout 15m ./...

  e2e:
    name: boot stack + seed E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    # Skip cleanly when the license secret is absent (e.g. fork PRs).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # Single source of truth: scripts/e2e.sh boots the stack, waits for crdb-init, asserts >=3
      # running changefeeds, connects to the SSE stream BEFORE seeding (the gateway has no backlog),
      # seeds one event through the real changefeed spine + HITL approval, asserts the seeded
      # sequence_engine_key reaches /api/stream, dumps logs on failure, and always tears down.
      # CRDB_LICENSE is optional (single-node v24.3+ runs changefeeds license-free); passed through
      # via env if the secret is set, ignored if not. The job runs either way — no skip.
      - name: Run end-to-end proof
        run: bash scripts/e2e.sh

  failtest-resume:
    name: test durable checkpoint resume
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run pod survival test
        run: bash scripts/failtest_killed_pod.sh

  failtest-exactly-once:
    name: test exactly-once delivery suppression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run exactly-once test
        run: bash scripts/failtest_exactly_once.sh

  failtest-restatement:
    name: test FIFO late-arrival restatement
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      - name: Run FIFO restatement test
        run: bash scripts/failtest_fifo_restatement.sh

  failtest-dlq-poison:
    name: test DLQ poison-pill routing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # The only test that exercises the dead-letter path. Every consumer commits its offset ONLY
      # after DLQ delivery is confirmed, so a broken DLQ wedges the partition permanently while every
      # happy-path job stays green. Asserts: poison pill reaches the .dlq topic, the source offset is
      # committed (lag drains to 0), and a VALID message after it still processes.
      - name: Run DLQ poison-pill test
        run: bash scripts/failtest_dlq_poison.sh

  failtest-agent-exactly-once:
    name: test agent exactly-once effect
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # The proof for the agent layer. The drafting agent calls a model OUTSIDE the workflow
      # transaction — it must, or a multi-second LLM call would hold a row lock — which makes node
      # execution at-least-once by construction. This kills the orchestrator mid-workflow and
      # asserts that the resumed run does NOT issue a second purchase order: at-least-once
      # execution, exactly-once EFFECT, enforced by a deterministic idempotency key rather than by
      # hoping the crash does not happen.
      - name: Run agent exactly-once test
        run: bash scripts/failtest_agent_exactly_once.sh

  security:
    name: security scan (gosec + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repo Security tab (free on public repos)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'

      # Pinned, like govulncheck and Trivy. This read `@latest` while the comment on the
      # govulncheck job three hundred lines up said "Pin the scanner to a tag, not @latest, or a
      # scanner release can redden the build with no code change" — the rule was written down and
      # then not applied here. gosec is report-only so an unpinned bump could not break a merge,
      # but it could silently change the finding count between two runs of identical code, which is
      # exactly what makes a report untrustworthy. Bump this tag deliberately.
      - name: gosec — Go SAST (both modules)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          # -no-fail: report findings without gating the build; we triage via the Security tab.
          #
          # -exclude-generated: skip protoc output. contracts/**/*.pb.go carried EIGHT permanent
          # G103 "use of unsafe calls" warnings that no one can act on — the unsafe is protoc-gen-go's
          # own, regenerated on every buf build, and hand-editing it is not an option. Findings that
          # cannot be fixed are not signal; they are the thing that teaches you to skim the list, and
          # this repo already has that lesson written down ("report-only scanners become unread
          # scanners"). Five REAL alerts sat unnoticed on master next to that noise until this week.
          # gosec detects generated files by the standard "Code generated ... DO NOT EDIT." header,
          # so this excludes exactly the files nobody owns and nothing else.
          gosec -no-fail -exclude-generated -fmt sarif -out gosec-root.sarif ./...
          ( cd services/viz-gateway && gosec -no-fail -exclude-generated -fmt sarif -out ../../gosec-viz.sarif ./... )
      - name: upload gosec (root)
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: gosec-root.sarif
          category: gosec-root
      - name: upload gosec (viz-gateway)
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: gosec-viz.sarif
          category: gosec-viz

      # Direct Trivy install + CLI, not aquasecurity/trivy-action — that composite action
      # transitively pins a setup-trivy tag that keeps breaking (v0.29.0 → setup-trivy@v0.2.2
      # is unresolvable). Installing the binary directly removes all transitive action-tag risk.
      # Installer script AND binary both pinned to an immutable release tag (not `main`) —
      # closes the unpinned-remote-code-execution surface flagged in review. Bump the tag to
      # upgrade, same as the @vN action pins elsewhere in this workflow.
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh | sh -s -- -b /usr/local/bin v0.72.0
      - name: Trivy — dependency + config/CVE scan
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format sarif \
            --output trivy.sarif
          # report-only for now; flip --exit-code to 1 once findings are triaged
      - name: upload Trivy
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy

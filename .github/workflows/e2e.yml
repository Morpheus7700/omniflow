name: OmniFlow CI + E2E

# Make-It-Real gate: build both Go modules, then actually BOOT the stack and prove one seeded
# procurement event flows end-to-end — through the real CRDB→Kafka changefeed spine, the DAG
# orchestrator's human-in-the-loop suspend/resume, and out to the viz SSE stream. No simulated logs.
#
# Test tiers, fastest first: `build`/`lint`/`frontend` need no services and run in a couple of
# minutes; `integration` runs the tag-gated testcontainers suite against a real CockroachDB; the six
# boot jobs run the full stack, one proof each. `govulncheck` is the only security job that gates.
#
# OPTIONAL repo secrets: CRDB_LICENSE / CRDB_ORG. NOT needed — the stack runs single-node, which does
# Kafka-sink changefeeds license-free. No job is skipped for a missing license; crdb-init fails loudly
# if a key ever becomes necessary.
#
# Every third-party action is pinned to a commit SHA with the version as a trailing comment.
# A tag is a moving pointer that its owner (or an attacker with their credentials) can re-point;
# a SHA is immutable. Dependabot's github-actions ecosystem understands the `sha # vX.Y.Z` form
# and bumps both together.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref: without this every push spawns a full parallel run while
# the previous one keeps burning runners, some pinned at the 25-minute job cap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the workflow level; the one job that uploads SARIF widens its own token.
permissions:
  contents: read

# Go toolchain: ONE pin, in go.mod, read by every job.
#
# The `toolchain go1.x.y` directive in both go.mod files is the single source of truth for the Go
# version this project builds, tests, scans and ships with. `setup-go` reads it via
# `go-version-file` (it honours `toolchain` over `go`), the Dockerfiles pin the matching golang image
# by digest, and a developer's `go` command auto-downloads it. The previous design pinned an exact
# version in ten YAML sites and one of them was missed — that job silently ran a floating '1.25' and
# scanned a stdlib the project never shipped, which is the exact hole the pin existed to close.
#
# The pin is still a manual obligation: Dependabot bumps action refs and image digests, never a
# toolchain line. When govulncheck reports a stdlib CVE "Fixed in: go1.x.y", bump go.mod (both
# modules) and the golang image digests together.

env:
  GOTOOLCHAIN: auto

jobs:
  build:
    name: build + vet + unit tests (both modules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/viz-gateway/go.sum
      # Formatting is a gate, not a suggestion: it is the cheapest possible signal, and gofmt is
      # semantics-preserving by construction so it can never fail for a reason that is really a
      # behaviour change. `./internal` is included — the shared platform packages were unformatted-
      # by-omission for a month because this list stopped at the service directories.
      - name: gofmt (both modules)
        run: |
          unformatted="$(gofmt -l ./services ./tools ./contracts ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            echo "Run: gofmt -w ./services ./tools ./contracts ./internal"
            exit 1
          fi
      # -race on a codebase whose whole thesis is concurrent consumers and manual commit ordering.
      # The testcontainers suite is excluded here by its `integration` build tag (see that job).
      - name: root module
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: viz-gateway module
        working-directory: services/viz-gateway
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test -race -count=1 ./...

  lint:
    name: lint (golangci-lint + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/viz-gateway/go.sum
      # Rules live in .golangci.yml at the repo root. Pinned linter version, same standard as the
      # scanners below: an unpinned linter release can redden the build with no code change.
      - name: golangci-lint (root module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: golangci-lint (viz-gateway module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: services/viz-gateway
      # The boot proofs and init scripts are load-bearing shell; a quoting bug in one of them once
      # ran a job to its 25-minute cap. Warning level and above gate; style-level findings do not.
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: ./scripts
          additional_files: infrastructure/init/crdb-init.sh infrastructure/init/kafka-init.sh

  frontend:
    name: frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24 matches frontend/Dockerfile's builder stage (Active LTS), for the same reason the Go
      # toolchain matches the Go images: CI should exercise the runtime that ships.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Lint GATES. It was advisory for a month because eslint-config-next's bundled
      # eslint-plugin-react uses an ESLint 9 API that ESLint 10 removed; the fix is to run the ESLint
      # line the toolchain supports (9.x, pinned in package.json, Dependabot ignores >=10 with the
      # reason) rather than run a newer ESLint that cannot lint anything.
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npx tsc --noEmit
      # `next build` here, not only inside the six boot jobs: a frontend build failure used to take
      # ~25 minutes and the whole Docker stack to report, and it took down every proof with it.
      - name: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Reachability-based CVE scanning, and the ONLY security job here that actually gates.
  # gosec and Trivy (below) are report-only, deliberately: they are broad and noisy enough that gating
  # on them trains everyone to ignore a red build. govulncheck walks the call graph and reports a
  # vulnerability only if the code actually reaches the affected symbol — small and true enough to
  # block on. If this job goes red, a reachable CVE landed: fix the dependency, do not add an exclusion.
  # Both modules are scanned; viz-gateway has its own go.mod and is invisible to a root-module scan.
  govulncheck:
    name: govulncheck (reachable CVEs, gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            services/viz-gateway/go.sum
      # Pinned to an immutable tag, not @latest — a scanner bump must not turn the build red on its
      # own. Bump deliberately, like any other pin.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: root module
        run: govulncheck ./...
      - name: viz-gateway module
        working-directory: services/viz-gateway
        run: govulncheck ./...

  integration:
    name: integration tests (testcontainers + real CRDB)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15   # container pull + boot should be minutes; a stall must fail fast, not hang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # ubuntu-latest runners ship a running Docker daemon, which is all testcontainers needs.
      # These cover what fakes cannot: single-transaction atomicity, the exactly-once idempotency
      # guard, lot ordering, and DECIMAL/INT8 fidelity through real SQL. The CockroachDB image is
      # read from docker-compose.yml so the tests and the stack cannot drift apart.
      - name: root module
        run: go test -tags=integration -timeout 15m -count=1 ./...

  # ---- Boot proofs -------------------------------------------------------------------------------
  # Each job runs one scripts/*.sh proof on the full compose stack. They share scripts/lib.sh, which
  # boots, gates on kafka-init and crdb-init, waits for every service's real healthcheck, and on
  # failure writes the complete container logs to .proof-logs/ — uploaded below as an artifact, so a
  # container that died after logging more than a tail's worth is no longer unrecoverable.
  #
  # None of these is skipped for fork PRs any more. A job-level `if:` skip counts as PASSING for a
  # required check, so a fork PR could go green with zero end-to-end coverage. The skip existed for
  # a license secret that is no longer needed.
  #
  # timeout-minutes matters: a Kafka-healthcheck or changefeed stall must fail fast and clean rather
  # than run to the 6-hour cap — and note GitHub reports a timeout expiry as "cancelled", not
  # "failure". If a job's duration equals its timeout, it hung.

  e2e:
    name: boot stack + seed E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # scripts/e2e.sh boots the stack, asserts the full topic topology and ≥3 running changefeeds,
      # waits for every service to be READY, connects to the SSE stream BEFORE seeding (the gateway
      # has no backlog), seeds one event through the real changefeed spine + HITL approval, and
      # asserts the seeded sequence_engine_key reaches /api/stream.
      - name: Run end-to-end proof
        run: bash scripts/e2e.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-e2e
          path: .proof-logs/
          if-no-files-found: ignore

  failtest-resume:
    name: test durable checkpoint resume
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run pod survival test
        run: bash scripts/failtest_killed_pod.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-resume
          path: .proof-logs/
          if-no-files-found: ignore

  failtest-exactly-once:
    name: test exactly-once delivery suppression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run exactly-once test
        run: bash scripts/failtest_exactly_once.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-exactly-once
          path: .proof-logs/
          if-no-files-found: ignore

  failtest-restatement:
    name: test FIFO late-arrival restatement
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run FIFO restatement test
        run: bash scripts/failtest_fifo_restatement.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-restatement
          path: .proof-logs/
          if-no-files-found: ignore

  failtest-dlq-poison:
    name: test DLQ poison-pill routing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The only test that exercises the dead-letter path. Every consumer commits its offset ONLY
      # after DLQ delivery is confirmed, so a broken DLQ wedges the partition permanently while every
      # happy-path job stays green. Asserts both a wire-level and a semantic (protovalidate) poison
      # pill reach the .dlq topic, and that a VALID message after them still processes.
      - name: Run DLQ poison-pill test
        run: bash scripts/failtest_dlq_poison.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-dlq-poison
          path: .proof-logs/
          if-no-files-found: ignore

  failtest-agent-exactly-once:
    name: test agent exactly-once effect
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The proof for the agent layer. The drafting agent calls a model OUTSIDE the workflow
      # transaction — it must, or a multi-second LLM call would hold a row lock — which makes node
      # execution at-least-once by construction. This kills the orchestrator mid-workflow and asserts
      # the resumed run does NOT issue a second purchase order: at-least-once execution, exactly-once
      # EFFECT, enforced by a deterministic idempotency key.
      - name: Run agent exactly-once test
        run: bash scripts/failtest_agent_exactly_once.sh
      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-logs-agent-exactly-once
          path: .proof-logs/
          if-no-files-found: ignore

  security:
    name: security scan (gosec + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repo Security tab (free on public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Report-only (-no-fail): findings are triaged in the Security tab, not gated on — see the
      # govulncheck job for why. -exclude-generated skips protoc output, whose unsafe calls are
      # protoc-gen-go's own and cannot be acted on; unactionable findings are what teach people to
      # skim the list. Pinned like every other scanner.
      - name: gosec — Go SAST (both modules)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -no-fail -exclude-generated -fmt sarif -out gosec-root.sarif ./...
          ( cd services/viz-gateway && gosec -no-fail -exclude-generated -fmt sarif -out ../../gosec-viz.sarif ./... )
      # Installer script AND binary pinned to an immutable release tag, and the installer's checksum
      # is verified before it runs: piping an unverified remote script into `sh` in a security job
      # was the one unpinned-remote-code surface left in this workflow.
      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.72.0
          # sha256 of contrib/install.sh at that tag. Bump both together.
          TRIVY_INSTALLER_SHA256: e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" -o install-trivy.sh
          echo "${TRIVY_INSTALLER_SHA256}  install-trivy.sh" | sha256sum -c -
          sh install-trivy.sh -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Trivy — dependency + config/CVE scan (report-only)
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format sarif \
            --output trivy.sarif
      # SARIF upload needs a write token, which a fork PR does not get; skip the uploads there rather
      # than fail the job for a reason unrelated to the diff.
      - name: upload gosec (root)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: gosec-root.sarif
          category: gosec-root
      - name: upload gosec (viz-gateway)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: gosec-viz.sarif
          category: gosec-viz
      - name: upload Trivy
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy.sarif
          category: trivy

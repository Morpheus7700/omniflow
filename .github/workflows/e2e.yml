name: OmniFlow CI + E2E

# Make-It-Real gate: build both Go modules, then actually BOOT the stack and prove one seeded
# procurement event flows end-to-end — through the real CRDB→Kafka changefeed spine, the DAG
# orchestrator's human-in-the-loop suspend/resume, and out to the viz SSE stream. No simulated logs.
#
# Test tiers, fastest first: `build` runs unit tests (no services), `integration` runs the tag-gated
# testcontainers suite against a real CockroachDB, and the four boot jobs run the full stack.
#
# OPTIONAL repo secrets (Settings → Secrets and variables → Actions):
#   CRDB_LICENSE  — CockroachDB Enterprise (free tier) license key. NOT needed here: the stack runs
#                   single-node v24.3+, which does Kafka-sink changefeeds license-free. Only a
#                   multi-node cluster would require it.
#   CRDB_ORG      — the organization string the license was issued to (must match exactly).
# No job is skipped for a missing license; crdb-init fails loudly if a key ever becomes necessary.

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs for the same ref. Without this every push spawns a full parallel run while
# the previous one keeps burning runners — during the CI convergence work several obsolete runs were
# still executing (some pinned at the 25-minute job cap) after their fix had already been pushed,
# which wasted minutes and made the signal harder to read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + vet + unit tests (both modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      # Unit tests need no Docker and no services — they run on every push in seconds. The
      # testcontainers suite is excluded here by its `integration` build tag (see the job below).
      - name: root module
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test ./...
      - name: viz-gateway module
        working-directory: services/viz-gateway
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          go test ./...

  integration:
    name: integration tests (testcontainers + real CRDB)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15   # container pull + boot should be minutes; a stall must fail fast, not hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      # ubuntu-latest runners ship a running Docker daemon, which is all testcontainers needs.
      # These cover what fakes cannot: single-transaction atomicity, the exactly-once idempotency
      # guard, lot ordering, and DECIMAL/INT8 fidelity through real SQL.
      - name: root module
        run: go test -tags=integration -timeout 15m ./...

  e2e:
    name: boot stack + seed E2E
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    # Skip cleanly when the license secret is absent (e.g. fork PRs).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # Single source of truth: scripts/e2e.sh boots the stack, waits for crdb-init, asserts >=3
      # running changefeeds, connects to the SSE stream BEFORE seeding (the gateway has no backlog),
      # seeds one event through the real changefeed spine + HITL approval, asserts the seeded
      # sequence_engine_key reaches /api/stream, dumps logs on failure, and always tears down.
      # CRDB_LICENSE is optional (single-node v24.3+ runs changefeeds license-free); passed through
      # via env if the secret is set, ignored if not. The job runs either way — no skip.
      - name: Run end-to-end proof
        run: bash scripts/e2e.sh

  failtest-resume:
    name: test durable checkpoint resume
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Run pod survival test
        run: bash scripts/failtest_killed_pod.sh

  failtest-exactly-once:
    name: test exactly-once delivery suppression
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Run exactly-once test
        run: bash scripts/failtest_exactly_once.sh

  failtest-restatement:
    name: test FIFO late-arrival restatement
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Run FIFO restatement test
        run: bash scripts/failtest_fifo_restatement.sh

  failtest-dlq-poison:
    name: test DLQ poison-pill routing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a Kafka-healthcheck / changefeed stall must fail fast+clean, not hang to the 6h cap
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CRDB_LICENSE: ${{ secrets.CRDB_LICENSE }}
      CRDB_ORG: ${{ secrets.CRDB_ORG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      # The only test that exercises the dead-letter path. Every consumer commits its offset ONLY
      # after DLQ delivery is confirmed, so a broken DLQ wedges the partition permanently while every
      # happy-path job stays green. Asserts: poison pill reaches the .dlq topic, the source offset is
      # committed (lag drains to 0), and a VALID message after it still processes.
      - name: Run DLQ poison-pill test
        run: bash scripts/failtest_dlq_poison.sh

  security:
    name: security scan (gosec + trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repo Security tab (free on public repos)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: gosec — Go SAST (both modules)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # -no-fail: report findings without gating the build; we triage via the Security tab.
          gosec -no-fail -fmt sarif -out gosec-root.sarif ./...
          ( cd services/viz-gateway && gosec -no-fail -fmt sarif -out ../../gosec-viz.sarif ./... )
      - name: upload gosec (root)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-root.sarif
          category: gosec-root
      - name: upload gosec (viz-gateway)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec-viz.sarif
          category: gosec-viz

      # Direct Trivy install + CLI, not aquasecurity/trivy-action — that composite action
      # transitively pins a setup-trivy tag that keeps breaking (v0.29.0 → setup-trivy@v0.2.2
      # is unresolvable). Installing the binary directly removes all transitive action-tag risk.
      # Installer script AND binary both pinned to an immutable release tag (not `main`) —
      # closes the unpinned-remote-code-execution surface flagged in review. Bump the tag to
      # upgrade, same as the @vN action pins elsewhere in this workflow.
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh | sh -s -- -b /usr/local/bin v0.72.0
      - name: Trivy — dependency + config/CVE scan
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --format sarif \
            --output trivy.sarif
          # report-only for now; flip --exit-code to 1 once findings are triaged
      - name: upload Trivy
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

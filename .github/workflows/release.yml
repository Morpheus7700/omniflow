name: Release images

# Publishes the five deployable images to GHCR on every version tag, each with:
#   - an SBOM (SPDX) and SLSA provenance attached as BuildKit attestations,
#   - a keyless cosign signature (Sigstore, bound to this workflow's OIDC identity — no key to leak),
#   - a GitHub build-provenance attestation (verifiable with `gh attestation verify`).
# Multi-arch for the Go services (they cross-compile — see the Dockerfiles); the frontend is
# amd64-only because `next build` under QEMU emulation is slow enough to time out a runner.
#
# Verify a published image:
#   cosign verify ghcr.io/morpheus7700/omniflow/commbot:<tag> \
#     --certificate-identity-regexp 'https://github.com/Morpheus7700/omniflow/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/morpheus7700/omniflow/commbot:<tag> --owner Morpheus7700
#
# The frontend image bakes NEXT_PUBLIC_API_BASE at build time (documented in its Dockerfile). The
# published image points at the compose default; a deployment against another gateway rebuilds it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/morpheus7700/omniflow

jobs:
  publish:
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # cosign keyless signing + provenance attestations
      attestations: write    # actions/attest-build-provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: commbot
            context: .
            dockerfile: services/commbot/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: p2p-orchestrator
            context: .
            dockerfile: services/p2p-orchestrator/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: inventory-intelligence
            context: .
            dockerfile: services/inventory-intelligence/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: viz-gateway
            context: services/viz-gateway
            dockerfile: services/viz-gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=omniflow-${{ matrix.image }}
            org.opencontainers.image.licenses=Apache-2.0

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE=http://localhost:8081
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: cosign sign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_PREFIX}/${{ matrix.image }}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A standalone SPDX SBOM as a workflow artifact, for anyone who wants the document without
      # pulling the image. The BuildKit attestation above is the one bound to the image itself.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: true

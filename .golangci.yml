# golangci-lint v2 configuration — applied to BOTH Go modules (the CI job runs it once per module).
#
# Deliberately a short, high-signal set. gosec runs separately (report-only, SARIF to the Security
# tab) and govulncheck gates reachable CVEs, so neither is repeated here. Everything enabled below
# either finds real bugs (errorlint, nilerr, bodyclose) or enforces a rule this repo already wrote
# down in .claude/rules (errcheck for "never discard an error", errorlint for "%w not %v").
version: "2"

run:
  timeout: 5m
  build-tags:
    - integration   # lint the testcontainers suite too; it is real code that runs in CI

linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose       # an unclosed response body leaks a connection per call
    - errorlint       # errors.Is/As and %w — string-matching an error is a rule violation here
    - nilerr          # returning nil when err != nil is a silent failure
    - unconvert       # noise that hides real casts
    - misspell
    - copyloopvar
    - durationcheck
    - makezero
    - nolintlint      # a //nolint without a reason is a finding, not an exemption
  settings:
    errcheck:
      # Closing a read-only body or a rolled-back tx on an error path: the return is genuinely
      # uninteresting and checking it would produce the `_ =` the rules forbid.
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.Rows).Close
        # `defer tx.Rollback(ctx)` after a successful Commit always returns pgx.ErrTxClosed; the
        # error paths that matter roll back explicitly and check the result (see service.go).
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (omniflow/services/p2p-orchestrator/internal/core/ports.Transaction).Rollback
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - contracts       # protoc output; regenerated by buf, never hand-edited
      - third_party

formatters:
  enable:
    - gofmt

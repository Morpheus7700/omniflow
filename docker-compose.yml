services:
  cockroachdb:
    image: cockroachdb/cockroach:v26.2.4
    command: start-single-node --insecure --accept-sql-without-tls
    ports:
      - "26257:26257"
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    # JVM image (not apache/kafka-native): the native GraalVM image ships no JRE, so the healthcheck's
    # kafka-broker-api-versions.sh (a Java-launching shell script) can't run — kafka would never report
    # healthy and every boot job would hang. The JVM image ships the same CLI scripts *with* a JRE.
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      # Two broker-facing listeners (PLAINTEXT + INTERNAL) both use the PLAINTEXT protocol, so Kafka
      # cannot infer which carries inter-broker traffic and exits(1) at startup. Name it explicitly.
      # INTERNAL (kafka:29092) is what every service and changefeed sink connects to.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-broker cluster: the internal __consumer_offsets / transaction-state topics default to
      # replication factor 3 and CANNOT be created on one broker, so consumer groups fail to find a
      # coordinator ("COORDINATOR_NOT_AVAILABLE") and no service ever consumes. Force RF=1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Form the consumer group immediately instead of waiting the default 3s rebalance window.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "omniflow-cluster-id-1234"
    # No named volume for /tmp/kafka-logs: an empty root-owned volume clobbers the image's
    # correctly-owned log dir and Kafka (non-root) fails to format storage —
    # "Error while writing meta.properties". This is an ephemeral CI test stack (each run ends in
    # `down -v`; the killed-pod test restarts the orchestrator, not Kafka), so persistence isn't needed.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates every topic before any Go client touches Kafka. Required because franz-go does not
  # request auto-topic-creation, so KAFKA_AUTO_CREATE_TOPICS_ENABLE above is inert for our services
  # (it only ever worked for CockroachDB's Java changefeed sink). Full reasoning in the script.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infrastructure:/infrastructure:ro
    entrypoint: ["/bin/bash", "/infrastructure/init/kafka-init.sh"]
    restart: "no"

  crdb-init:
    image: cockroachdb/cockroach:v26.2.4
    depends_on:
      cockroachdb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Changefeeds must emit into topics that already exist with our intended partition/RF config,
      # not ones the sink creates ad hoc. This also transitively orders all five app services after
      # kafka-init, since each of them already gates on crdb-init.
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./infrastructure:/infrastructure:ro
    entrypoint: ["/bin/bash", "/infrastructure/init/crdb-init.sh"]
    environment:
      CRDB_LICENSE: ${CRDB_LICENSE:-}
      CRDB_ORG: ${CRDB_ORG:-OmniFlow}
    restart: "no"

  # Deterministic LLM stand-in for the E2E `email` seed mode. Lets the LOCKED CommBot classification
  # path run without a real model or spend. Never part of the shipped system.
  mock-llm:
    build:
      context: .
      dockerfile: tools/mock-llm/Dockerfile
    environment:
      MOCK_LLM_ADDR: ":4000"
      MOCK_LLM_INTENT: "1"

  commbot:
    build:
      context: .
      dockerfile: services/commbot/Dockerfile
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    environment:
      CRDB_DSN: "postgres://root@cockroachdb:26257/omniflow?sslmode=disable"
      KAFKA_BOOTSTRAP: "kafka:29092"
      # Used only by the `email` seed mode; harmless when the default `outbox` mode is used.
      LITELLM_URL: "http://mock-llm:4000"
      OBJECT_STORE_HOSTS: "storage.googleapis.com,raw.githubusercontent.com"

  inventory-intelligence:
    build:
      context: .
      dockerfile: services/inventory-intelligence/Dockerfile
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    environment:
      CRDB_DSN: "postgres://root@cockroachdb:26257/omniflow?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"

  p2p-orchestrator:
    build:
      context: .
      dockerfile: services/p2p-orchestrator/Dockerfile
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    environment:
      CRDB_DSN: "postgres://root@cockroachdb:26257/omniflow?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"

  viz-gateway:
    build:
      # viz-gateway is its OWN Go module — context must be the module dir, not the repo root.
      # Its Dockerfile does `COPY go.mod go.sum` + `go build ./cmd` relative to that module.
      # (The root-module services use context: . with ./services/X/cmd paths — different case.)
      context: services/viz-gateway
      dockerfile: Dockerfile
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://root@cockroachdb:26257/omniflow?sslmode=disable"
      CRDB_DSN: "postgres://root@cockroachdb:26257/omniflow?sslmode=disable"
      KAFKA_BROKERS: "kafka:29092"
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Origin only — the client appends /api/stream and /api/replay (see frontend/src/lib/config.ts).
        # 8081 is viz-gateway on the host (mapped 8081:8080); host 8080 is CockroachDB's admin UI.
        NEXT_PUBLIC_API_BASE: "http://localhost:8081"
    depends_on:
      crdb-init:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

# OpenTelemetry Collector — receives OTLP from the four services and forwards traces to Tempo.
# Metrics are not routed through here: every service exposes /metrics and Prometheus scrapes them
# directly (see prometheus.yml), which is one fewer hop to debug.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

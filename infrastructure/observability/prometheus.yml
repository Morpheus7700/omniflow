# Prometheus scrapes every service's /metrics on its health port (compose DNS names). The
# instruments are defined in internal/platform/metrics (and viz-gateway's copy).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: omniflow
    static_configs:
      - targets:
          - commbot:8080
          - inventory-intelligence:8080
          - p2p-orchestrator:8080
          - viz-gateway:8080
